  const matBody=new T.MeshStandardMaterial({color:0x242834,metalness:.75,roughness:.32,flatShading:true});
  const matMetal=new T.MeshStandardMaterial({color:0x8e99aa,metalness:.85,roughness:.25,flatShading:true});
  const matNeon=new T.MeshStandardMaterial({color:w.c,emissive:w.c,emissiveIntensity:.75,metalness:.3,roughness:.3});
  const add=(geo,mat,x,y,z,rx=0,ry=0,rz=0)=>{
    const m=new T.Mesh(geo,mat);m.position.set(x,y,z);if(rx||ry||rz)m.rotation.set(rx,ry,rz);g.add(m);return m;
  };
  const len=w.vd[2];
  add(new T.BoxGeometry(w.vd[0],w.vd[1]*.85,len*.62),matBody,0,.02,0);
  add(new T.BoxGeometry(w.vd[0]*.55,w.vd[1]*.22,len*.72),matMetal,0,.02+w.vd[1]*.48,-.03);
  const barrel=add(new T.CylinderGeometry(w.vd[0]*.22,w.vd[0]*.24,len*.52,10),matMetal,0,.03,-len*.42,Math.PI/2,0,0);
  add(new T.BoxGeometry(w.vd[0]*1.04,w.vd[1]*.24,len*.48),matNeon,0,.025,-.04);
  add(new T.BoxGeometry(w.vd[0]*.62,.14,.075),matBody,0,-.08,.09,-.28,0,0);
  if(idx===4){
    barrel.scale.set(1.75,1,1.75);
    add(new T.CylinderGeometry(w.vd[0]*.48,w.vd[0]*.48,.06,12),matNeon,0,.03,-len*.66,Math.PI/2,0,0);
  }else if(idx===5||idx===6){
    for(let k=0;k<3;k++)add(new T.BoxGeometry(w.vd[0]*1.15,w.vd[1]*.75,.025),matNeon,0,.03,-len*.25-k*.11);
  }
  return{group:g};
}

function setW(i){
  cw=i;
  if(!T||!wRig)return;
  const w=W[i];
  while(wRig.children.length)wRig.remove(wRig.children[0]);
  if(i===0){wParts=buildDesertEagle();wRig.add(wParts.group);mfl.position.set(0,.052,-.33);}
  else if(i===1){wParts=buildTacticalShotgun();wRig.add(wParts.group);wParts.updateAmmoDisplay(w.ammo);mfl.position.set(0,.052,-.59);}
  else if(i===2){wParts=buildUziSMG();wRig.add(wParts.group);mfl.position.set(0,.038,-.26);}
  else if(i===3){wParts=buildAssaultRifle();wRig.add(wParts.group);mfl.position.set(0,.035,-.54);}
  else{wParts=buildOtherWeapon(w,i);wRig.add(wParts.group);mfl.position.set(0,.03,-w.vd[2]/2-.18);}
}

/* ===== SISTEMA CENTRALIZADO DE NAVEGAÇÃO EM TODAS AS TELAS (MenuNav) ===== */
let currentMenu='main',gpReturnMenu='main',cfReturnMenu='main';

const MenuNav={
  focusedEl:null,
  savedKey:null,
  dirHeld:null,
  repeatTimer:0,
  actionLock:0,
  dialogOpen:false,
  dialogOnConfirm:null,

  isVisible(){
    return this.dialogOpen || ($('m') && $('m').style.display !== 'none');
  },

  getContainer(){
    return this.dialogOpen ? $('gpDialog') : $('m');
  },

  getItems(){
    const root=this.getContainer();
    if(!root)return[];
    return Array.from(root.querySelectorAll('button:not(:disabled),input[type="range"]:not(:disabled),input[type="checkbox"]:not(:disabled),select:not(:disabled),[data-nav]:not([disabled])'))
      .filter(el=>el.offsetParent!==null && !el.closest('[hidden]'));
  },

  getNavKey(el){
    if(!el)return null;
    if(el.dataset && el.dataset.navKey)return el.dataset.navKey;
    if(el.id)return 'id:'+el.id;
    const oc=el.getAttribute('onclick')||el.getAttribute('oninput')||el.getAttribute('onchange')||'';
    return oc ? 'fn:'+oc : 'txt:'+el.textContent.trim();
  },

  setFocus(el,scroll=true){
    const items=this.getItems();
    items.forEach(item=>{
      const active=(item===el);
      item.classList.toggle('gp-focus',active);
      if(item.parentElement && item.parentElement.classList.contains('row')){
        item.parentElement.classList.toggle('gp-row-active',active);
      }
    });
    this.focusedEl=el||null;
    this.savedKey=this.getNavKey(el);
    if(el){
      try{el.focus({preventScroll:true})}catch(e){}
      if(scroll){
        try{el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}catch(e){}
      }
    }
  },

  sync(preserveFocus=false){
    const items=this.getItems();
    const bar=$('gpNavBar');
    if(bar)bar.classList.toggle('show',this.isVisible() && GP.connected && !GP.listening);
    if(!items.length){this.focusedEl=null;return}
    let target=null;
    if(preserveFocus && this.savedKey){
      target=items.find(el=>this.getNavKey(el)===this.savedKey)||null;
    }
    if(!target && this.focusedEl && items.includes(this.focusedEl)){
      target=this.focusedEl;
    }
    if(!target)target=items[0];
    this.setFocus(target,false);
  },

  findNeighbor(dir){
    const items=this.getItems();
    if(!items.length)return null;
    if(!this.focusedEl || !items.includes(this.focusedEl))return items[0];
    if(items.length===1)return items[0];

    const cur=this.focusedEl;
    const cr=cur.getBoundingClientRect();
    const cx=cr.left+cr.width/2,cy=cr.top+cr.height/2;

    let best=null,bestScore=1e9;
    for(const cand of items){
      if(cand===cur)continue;
      const r=cand.getBoundingClientRect();
      const x=r.left+r.width/2,y=r.top+r.height/2;
      const dx=x-cx,dy=y-cy;

      if(dir==='up' && dy>=-4)continue;
      if(dir==='down' && dy<=4)continue;
      if(dir==='left' && dx>=-4)continue;
      if(dir==='right' && dx<=4)continue;

      let score=1e9;
      if(dir==='up'||dir==='down'){
        const p=Math.abs(dy),s=Math.abs(dx);
        const colLimit=Math.max(cr.width,r.width)*.85;
        score=p + s*(s>colLimit?3.6:1.8);
      }else{
        const p=Math.abs(dx),s=Math.abs(dy);
        const sameRow=s<32;
        score=p + s*(sameRow?1.2:4.5);
      }
      if(score<bestScore){bestScore=score;best=cand}
    }

    if(!best){
      const idx=items.indexOf(cur);
      if(dir==='down')best=items[0];
      else if(dir==='up')best=items[items.length-1];
      else if(dir==='right')best=items[(idx+1)%items.length];
      else if(dir==='left')best=items[(idx-1+items.length)%items.length];
    }
    return best;
  },

  adjustControl(el,dir){
    if(!el)return false;
    if(el.tagName==='INPUT' && el.type==='range'){
      const step=parseFloat(el.step)||.05;
      const min=parseFloat(el.min);
      const max=parseFloat(el.max);
      const val=parseFloat(el.value);
      const next=cl(Math.round((val+(dir==='right'?step:-step))*1000)/1000,min,max);
      if(next!==val){
        el.value=next;
        el.dispatchEvent(new Event('input',{bubbles:true}));
        snd(520,.025,'sine',.035,1.08);
      }
      return true;
    }
    return false;
  },

  activate(el){
    if(!el || el.disabled)return;
    if(el.tagName==='INPUT' && el.type==='checkbox'){
      el.checked=!el.checked;
      el.dispatchEvent(new Event('change',{bubbles:true}));
      snd(580,.05,'sine',.06,1.2);
      return;
    }
    if(el.tagName==='INPUT' && el.type==='range'){
      snd(480,.04,'sine',.05,1.1);
      return;
    }
    el.click();
  },

  handleDirection(dir,dt){
    if(!dir){
      this.dirHeld=null;
      this.repeatTimer=0;
      return;
    }
    const isNew=(this.dirHeld!==dir);
    if(isNew){
      this.dirHeld=dir;
      this.repeatTimer=.32;
    }else{
      this.repeatTimer-=dt;
      if(this.repeatTimer>0)return;
      this.repeatTimer=.13;
    }

    if(!this.focusedEl || !this.getItems().includes(this.focusedEl)){
      this.sync(false);
      return;
    }

    if((dir==='left'||dir==='right') && this.adjustControl(this.focusedEl,dir)){
      return;
    }

    const next=this.findNeighbor(dir);
    if(next && next!==this.focusedEl){
      this.setFocus(next,true);
      snd(440,.03,'sine',.04,1.1);
    }
  },

  openDialog(title,message,confirmText,onConfirm){
    this.dialogOpen=true;
    this.dialogOnConfirm=onConfirm;
    const dlg=$('gpDialog');
    dlg.innerHTML=`<div class="gp-dlg-box">
      <h2>${title}</h2>
      <p>${message}</p>
      <div class="gp-dlg-actions">
        <button data-nav-key="dlg-confirm" onclick="MenuNav.confirmDialog()">${confirmText||'Confirmar'}</button>
        <button data-nav-key="dlg-cancel" style="border-color:var(--a)" onclick="MenuNav.closeDialog()">Cancelar</button>
      </div>
    </div>`;
    dlg.classList.add('show');
    this.actionLock=.2;
    this.sync(false);
  },

  confirmDialog(){
    const fn=this.dialogOnConfirm;
    this.closeDialog();
    if(typeof fn==='function')fn();
  },

  closeDialog(){
    this.dialogOpen=false;
    this.dialogOnConfirm=null;
    const dlg=$('gpDialog');
    if(dlg){dlg.classList.remove('show');dlg.innerHTML=''}
    this.actionLock=.2;
    this.sync(true);
  },

  goBack(){
    if(this.dialogOpen){
      this.closeDialog();
      snd(340,.05,'square',.05,.8);
      return true;
    }
    if(state==='pause' && currentMenu==='pause'){
      G.res(true);
      return true;
    }
    if(currentMenu==='gp'){
      menu(gpReturnMenu,null,false);
      snd(340,.05,'square',.05,.8);
      return true;
    }
    if(currentMenu==='cf'){
      menu(cfReturnMenu,null,false);
      snd(340,.05,'square',.05,.8);
      return true;
    }
    if(currentMenu!=='main' && state==='menu'){
      menu('main',null,false);
      snd(340,.05,'square',.05,.8);
      return true;
    }
    return false;
  },

  update(dt,navInput){
    if(this.actionLock>0)this.actionLock-=dt;
    if(!this.isVisible())return;

    this.handleDirection(navInput.dir,dt);

    if(this.actionLock>0)return;

    if(navInput.confirm){
      this.actionLock=.2;
      if(!this.focusedEl || !this.getItems().includes(this.focusedEl))this.sync(false);
      this.activate(this.focusedEl);
      return;
    }
    if(navInput.back){
      this.actionLock=.2;
      this.goBack();
      return;
    }
    if(navInput.start){
      this.actionLock=.25;
      if(this.dialogOpen){
        this.closeDialog();
      }else if(state==='pause' && currentMenu==='pause'){
        G.res(true);
      }else if(currentMenu==='main'){
        openCfMenu('main');
      }else if(currentMenu==='cf'){
        openGpMenu('cf');
      }else{
        this.goBack();
      }
    }
  }
};

});

  }
});

const GP={
  connected:false,
  blocked:false,
  index:-1,
  id:'',
  profile:{type:'generic',label:'Genérico'},
  listening:null,
  listenTimer:0,
  baseline:null,
  prev:{},
  prevNav:{},
  toastTimer:0,
  testerOpen:true,

  actions:[
    {k:'moveFwd',label:'Mover para Frente',cat:'move'},
    {k:'moveBack',label:'Mover para Trás',cat:'move'},
    {k:'moveLeft',label:'Mover para Esquerda',cat:'move'},
    {k:'moveRight',label:'Mover para Direita',cat:'move'},
    {k:'lookUp',label:'Mirar para Cima',cat:'move'},
    {k:'lookDown',label:'Mirar para Baixo',cat:'move'},
    {k:'lookLeft',label:'Mirar para Esquerda',cat:'move'},
    {k:'lookRight',label:'Mirar para Direita',cat:'move'},
    {k:'fire',label:'Atirar',cat:'combat'},

    {k:'reload',label:'Recarregar',cat:'combat'},

    {k:'prevWeapon',label:'Trocar Arma (Anterior)',cat:'combat'},
    {k:'pause',label:'Pausar o Jogo',cat:'combat'}
  ],

  detectProfile(gp){
    const id=(gp&&gp.id)||'';
    if(/xbox|xinput|045e|360|one|series/i.test(id))return{type:'xbox',label:'Xbox'};
    if(/playstation|dualshock|dualsense|sony|054c|ps3|ps4|ps5|wireless controller/i.test(id))return{type:'ps',label:'PlayStation'};
    if(/nintendo|switch|pro controller|joy-con|057e/i.test(id))return{type:'nintendo',label:'Nintendo'};
    return{type:'generic',label:gp&&gp.mapping==='standard'?'Genérico Padrão':'Genérico USB/BT'};
  },

  cleanName(id){
    if(!id)return'Nenhum controle';
    return id.replace(/\s*\(STANDARD GAMEPAD.*?\)/i,'').replace(/\s*\(Vendor:.*?\)/i,'').trim()||id;
  },

  formatBinding(b,profType){
    if(!b)return'Não mapeado';
    const t=profType||this.profile.type;
    if(b.type==='button'){
      const maps={
        xbox:['A','B','X','Y','LB','RB','LT','RT','View','Menu','L3','R3','D-Pad ↑','D-Pad ↓','D-Pad ←','D-Pad →','Xbox'],
        ps:['✕','○','□','△','L1','R1','L2','R2','Share','Options','L3','R3','D-Pad ↑','D-Pad ↓','D-Pad ←','D-Pad →','PS'],
        nintendo:['B','A','Y','X','L','R','ZL','ZR','-','+','L3','R3','D-Pad ↑','D-Pad ↓','D-Pad ←','D-Pad →','Home'],
        generic:['Botão 0 (A/✕)','Botão 1 (B/○)','Botão 2 (X/□)','Botão 3 (Y/△)','Botão 4 (L1/LB)','Botão 5 (R1/RB)','Botão 6 (L2/LT)','Botão 7 (R2/RT)','Botão 8 (Select)','Botão 9 (Start)','Botão 10 (L3)','Botão 11 (R3)','D-Pad ↑','D-Pad ↓','D-Pad ←','D-Pad →','Botão 16']
      };
      const arr=maps[t]||maps.generic;
      return arr[b.index]||`Botão ${b.index}`;
    }
    if(b.type==='axis'){
      const stdAxes={
        '0:-1':'Analógico Esq. ←','0:1':'Analógico Esq. →',
        '1:-1':'Analógico Esq. ↑','1:1':'Analógico Esq. ↓',
        '2:-1':'Analógico Dir. ←','2:1':'Analógico Dir. →',
        '3:-1':'Analógico Dir. ↑','3:1':'Analógico Dir. ↓'
      };
      const key=`${b.index}:${b.dir}`;
      return stdAxes[key]?`${stdAxes[key]} (E${b.index}${b.dir>0?'+':'-'})`:`Eixo ${b.index}${b.dir>0?'+':'-'}`;
    }
    return'Desconhecido';
  },

  toast(text,warn=false){
    const el=$('gpToast');if(!el)return;
    el.textContent=text;
    el.className='show'+(warn?' warn':'');
    clearTimeout(this.toastTimer);
    this.toastTimer=setTimeout(()=>{el.className=warn?'warn':''},3600);
  },

  getActiveGamepad(){
    if(this.blocked || !navigator || typeof navigator.getGamepads!=='function')return null;
    try{
      const list=navigator.getGamepads();
      if(!list)return null;
      if(this.index>=0&&list[this.index]&&list[this.index].connected)return list[this.index];
      for(let i=0;i<list.length;i++){
        const g=list[i];
        if(g&&g.connected&&(g.buttons.length>0||g.axes.length>0))return g;
      }
    }catch(e){
      this.blocked=true;
    }
    return null;
  },

  onConnect(gp){
    this.connected=true;
    this.index=gp.index;
    this.id=this.cleanName(gp.id);
    this.profile=this.detectProfile(gp);
    this.toast(`CONTROLE CONECTADO: ${this.id} [${this.profile.label}]`,false);
    if(currentMenu==='gp')menu('gp',null,true);
    else MenuNav.sync(true);
  },

  onDisconnect(gp){
    const wasActive=!gp||gp.index===this.index||!this.getActiveGamepad();
    const other=this.getActiveGamepad();
    if(other){
      this.connected=true;
      this.index=other.index;
      this.id=this.cleanName(other.id);
      this.profile=this.detectProfile(other);
      this.toast(`CONTROLE ALTERNADO: ${this.id}`,false);
    }else if(wasActive){
      this.connected=false;
      this.index=-1;
      this.id='';
      this.listening=null;
      resetInputs();
      this.toast('AVISO: CONTROLE DESCONECTADO! Teclado e mouse ativos.',true);
      if(state==='play')pauseGame();
    }
    if(currentMenu==='gp')menu('gp',null,true);
    else MenuNav.sync(true);
  },

  startBind(actionKey){
    const gp=this.getActiveGamepad();
    if(!gp){
      this.toast(this.blocked?'Acesso ao Gamepad bloqueado pelo navegador/iframe.':'Conecte um controle primeiro para mapear comandos!',true);
      return;
    }
    this.listening=actionKey;
    this.listenTimer=8.0;
    this.baseline={
      buttons:gp.buttons.map(b=>!!(b&&(b.pressed||b.value>.5))),
      axes:Array.from(gp.axes||[])
    };
    snd(520,.07,'sine',.07,1.2);
    menu('gp',null,true);
  },

  cancelBind(){
    if(!this.listening)return;
    this.listening=null;
    this.baseline=null;
    MenuNav.actionLock=.25;
    if(currentMenu==='gp')menu('gp',null,true);
  },

  clearBind(actionKey){
    S.gp.bindings[actionKey]=null;
    sv();
    snd(320,.06,'square',.05,.7);
    if(currentMenu==='gp')menu('gp',null,true);
  },

  resetDefaults(){
    S.gp=cloneDefaultGp();
    this.listening=null;
    sv();
    snd(600,.1,'sine',.08,1.4);
    this.toast('Mapeamento padrão restaurado!',false);
    if(currentMenu==='gp')menu('gp',null,true);
  },

  readBinding(gp,b,dz){
    if(!gp||!b)return 0;
    if(b.type==='button'){
      const btn=gp.buttons[b.index];
      if(!btn)return 0;
      const v=typeof btn.value==='number'?btn.value:(btn.pressed?1:0);
      if(btn.pressed)return Math.max(v,1);
      return v>.14?(v-.14)/.86:0;
    }
    if(b.type==='axis'){
      const raw=(gp.axes&&gp.axes[b.index])||0;
      const signed=raw*b.dir;
      if(signed<=dz)return 0;
      return cl((signed-dz)/(1-dz),0,1);
    }
    return 0;
  },

  handleCapture(gp,dt){
    if(!gp||!this.listening||!this.baseline)return;
    this.listenTimer-=dt;
    const btnEl=document.querySelector('.gp-btn-map.listening');
    if(btnEl)btnEl.textContent=`Pressione... (${Math.max(1,Math.ceil(this.listenTimer))}s)`;
    if(this.listenTimer<=0){
      this.toast('Tempo esgotado. Mapeamento cancelado.',true);
      this.cancelBind();
      return;
    }

    for(let i=0;i<gp.buttons.length;i++){
      const btn=gp.buttons[i];
      const nowPressed=!!(btn&&(btn.pressed||btn.value>.55));
      if(!nowPressed && this.baseline.buttons[i]){
        this.baseline.buttons[i]=false;
      }else if(nowPressed && !this.baseline.buttons[i]){
        S.gp.bindings[this.listening]={type:'button',index:i};
        this.listening=null;
        this.baseline=null;
        this.prev={};
        this.prevNav={confirm:true,back:true,start:true};
        MenuNav.actionLock=.28;
        sv();
        snd(760,.09,'sine',.09,1.35);
        menu('gp',null,true);
        return;
      }
    }

    for(let i=0;i<(gp.axes?gp.axes.length:0);i++){
      const cur=gp.axes[i]||0;
      const base=this.baseline.axes[i]||0;
      if(Math.abs(cur)<.25 && Math.abs(base)>.5)this.baseline.axes[i]=0;
      if(Math.abs(cur-base)>.55 && Math.abs(cur)>.55){
        S.gp.bindings[this.listening]={type:'axis',index:i,dir:cur>0?1:-1};
        this.listening=null;
        this.baseline=null;
        this.prev={};
        this.prevNav={confirm:true,back:true,start:true};
        MenuNav.actionLock=.28;
        sv();
        snd(760,.09,'sine',.09,1.35);
        menu('gp',null,true);
        return;
      }
    }
  },

  updateTesterUI(gp,vals){
    const dzPct=Math.round(S.gp.deadzone*100);
    document.querySelectorAll('.gp-dz').forEach(el=>{el.style.width=dzPct+'%';el.style.height=dzPct+'%'});

    const lx=gp&&gp.axes?cl(gp.axes[0]||0,-1,1):0;
    const ly=gp&&gp.axes?cl(gp.axes[1]||0,-1,1):0;
    const rx=gp&&gp.axes?cl(gp.axes[2]||0,-1,1):0;
    const ry=gp&&gp.axes?cl(gp.axes[3]||0,-1,1):0;

    const lNub=$('gpNubL'),rNub=$('gpNubR');
    if(lNub)lNub.style.transform=`translate(${lx*34}px,${ly*34}px)`;

    if(rTxt)rTxt.textContent=`X:${rx.toFixed(2)} Y:${ry.toFixed(2)}`;

    const rawBox=$('gpRawLive');
    if(rawBox){
      if(!gp){

      }else{
        const activeInputs=[];
        gp.buttons.forEach((b,i)=>{
          if(b&&(b.pressed||b.value>.15)){
            const nm=this.formatBinding({type:'button',index:i});
            activeInputs.push(`<span class="gp-tag">${nm} (${Math.round((b.value||1)*100)}%)</span>`);
          }
        });
        (gp.axes||[]).forEach((v,i)=>{
          if(Math.abs(v)>S.gp.deadzone){
            const nm=this.formatBinding({type:'axis',index:i,dir:v>0?1:-1});
            activeInputs.push(`<span class="gp-tag">${nm} (${Math.round(Math.abs(v)*100)}%)</span>`);
          }
        });
        rawBox.innerHTML=activeInputs.length?activeInputs.join(''):'<small>Nenhum botão ou eixo ativo no momento.</small>';
      }
    }

    const actBox=$('gpActLive');
    if(actBox){
      const activeActs=this.actions.filter(a=>(vals[a.k]||0)>.1).map(a=>`<span class="gp-tag act">${a.label}</span>`);
      actBox.innerHTML=activeActs.length?activeActs.join(''):'<small>Aguardando comando...</small>';

  poll(dt){
    const gp=this.getActiveGamepad();
    if(gp&&!this.connected)this.onConnect(gp);
    else if(!gp&&this.connected)this.onDisconnect(null);

    if(!gp){
      Object.assign(gpState,{moveX:0,moveZ:0,lookX:0,lookY:0,fireHeld:false,jumpHeld:false,slideHeld:false,dashHeld:false});
      this.prev={};this.prevNav={};
      if(currentMenu==='gp')this.updateTesterUI(null,{});
      return;
    }

    if(this.listening){
      this.handleCapture(gp,dt);
      return;
    }

    const dz=S.gp.deadzone;
    const vals={},jp={};
    for(const a of this.actions){
      const v=this.readBinding(gp,S.gp.bindings[a.k],dz);
      vals[a.k]=v;
      const isDown=v>.45;
      jp[a.k]=isDown&&!this.prev[a.k];
      this.prev[a.k]=isDown;
    }

    let mx=vals.moveRight-vals.moveLeft;
    let mz=vals.moveFwd-vals.moveBack;
    if(S.gp.invertMoveY)mz=-mz;
    gpState.moveX=cl(mx,-1,1);
    gpState.moveZ=cl(mz,-1,1);

    const curve=v=>v>0?Math.pow(v,1.35):0;
    let lx=curve(vals.lookRight)-curve(vals.lookLeft);
    let ly=curve(vals.lookUp)-curve(vals.lookDown);
    if(S.gp.invertX)lx=-lx;
    if(S.gp.invertY)ly=-ly;
    gpState.lookX=lx;
    gpState.lookY=ly;

    gpState.fireHeld=vals.fire>.25;
    gpState.jumpHeld=vals.jump>.45;
    gpState.slideHeld=vals.slide>.45;
    gpState.dashHeld=vals.dash>.45;

    if(currentMenu==='gp')this.updateTesterUI(gp,vals);

    if(state==='play'){
      if(jp.jump)K.jp=1;
      if(jp.slide)K.cp=1;
      if(jp.dash)K.dash=1;
      if(jp.grapple)K.gp=1;
      if(jp.reload)rel();
      if(jp.nextWeapon)cycleWeapon(1);
      if(jp.prevWeapon)cycleWeapon(-1);
      if(jp.pause)pauseGame();
    }else{
      const btnDown=idx=>!!(gp.buttons[idx]&&(gp.buttons[idx].pressed||gp.buttons[idx].value>.5));
      const up=vals.moveFwd>.52 || btnDown(12) || (gp.axes&&gp.axes[1]<-.52);
      const down=vals.moveBack>.52 || btnDown(13) || (gp.axes&&gp.axes[1]>.52);
      const left=vals.moveLeft>.52 || btnDown(14) || (gp.axes&&gp.axes[0]<-.52);
      const right=vals.moveRight>.52 || btnDown(15) || (gp.axes&&gp.axes[0]>.52);

      let dir=null;
      if(up)dir='up';
      else if(down)dir='down';
      else if(left)dir='left';
      else if(right)dir='right';

      const confirmDown=vals.jump>.5 || btnDown(0);
      const backDown=vals.slide>.5 || btnDown(1);
      const startDown=vals.pause>.5 || btnDown(9);

      const navInput={
        dir,
        confirm:confirmDown && !this.prevNav.confirm,
        back:backDown && !this.prevNav.back,
        start:startDown && !this.prevNav.start
      };
      this.prevNav={confirm:confirmDown,back:backDown,start:startDown};

      MenuNav.update(dt,navInput);
    }
  }
};
